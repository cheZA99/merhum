version: 2

# One grouped PR per ecosystem per month, so CI runs a handful of times instead of once per package.
# Major versions are not offered: they usually need code changes (or a newer .NET/Dart SDK) and are
# upgraded by hand when needed. Packages that release together, like MailKit and MimeKit, land in one PR.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: pub
    directories:
      - /merhum_mobile
      - /merhum_desktop
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pub:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /MerhumAPI
      - /MerhumWorker
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dotnet-images:
        patterns: ["*"]
