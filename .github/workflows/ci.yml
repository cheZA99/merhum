name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1-5"

# PR runs share a group and cancel each other; every other run gets its own group so nothing on main is ever cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FLUTTER_VERSION: "3.41.6"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            flutter:
              - 'merhum_mobile/**'
              - 'merhum_desktop/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Merhum.ci.slnf

      # these files mix tabs and spaces and are left as they are
      - name: Check formatting
        run: >
          dotnet format Merhum.ci.slnf --verify-no-changes --no-restore
          --exclude
          MerhumAPI/Program.cs
          MerhumAPI/Controllers/ReferenceDataController.cs
          MerhumAPI/Data/SeedData.cs
          MerhumAPI/Services/Payment/PaymentService.cs
          MerhumAPI/Services/MachineLearning

      - name: Build
        run: dotnet build Merhum.ci.slnf --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Merhum.ci.slnf
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults
          --collect "XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/Migrations/*.cs"

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('TestResults/*/coverage.cobertura.xml') != '' }}
        run: |
          dotnet reportgenerator \
            -reports:"TestResults/*/coverage.cobertura.xml" \
            -targetdir:coverage \
            -reporttypes:"MarkdownSummaryGithub;Cobertura"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Check for vulnerable packages
        run: |
          found=0
          for project in $(git ls-files '*.csproj'); do
            count=$(dotnet list "$project" package --vulnerable --include-transitive --format json \
              | jq '[.projects[].frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?)] | length')
            if [ "$count" -gt 0 ]; then
              found=1
              dotnet list "$project" package --vulnerable --include-transitive
            fi
          done
          exit "$found"

  flutter:
    name: Flutter (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.flutter == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [merhum_mobile, merhum_desktop]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get packages
        run: flutter pub get

      # the Dart code is not kept in dart format style, so formatting is not checked;
      # info-level lints (deprecations, style hints) are reported but do not fail the job
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Set up Java
        if: matrix.app == 'merhum_mobile' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        if: matrix.app == 'merhum_mobile' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: flutter build apk --debug

      - name: Upload APK
        if: matrix.app == 'merhum_mobile' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: merhum-mobile-debug-apk
          path: merhum_mobile/build/app/outputs/flutter-apk/app-debug.apk

  # a skipped matrix job reports an unexpanded name, so branch protection requires this job instead
  flutter-result:
    name: Flutter result
    needs: flutter
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Flutter jobs
        env:
          RESULT: ${{ needs.flutter.result }}
        run: |
          echo "Flutter jobs: $RESULT"
          [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]

  docker:
    name: Docker image
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/merhum-api"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ref=$name:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: MerhumAPI/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          format: table
          output: trivy.txt
          exit-code: "0"

      - name: Scan summary
        if: ${{ !cancelled() && hashFiles('trivy.txt') != '' }}
        run: |
          {
            echo "## Trivy: CRITICAL and HIGH"
            echo '```'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  migrations:
    name: Migration bundle
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Program.cs reads the JWT key while EF builds the host, so design-time runs need a placeholder
      JWT__Key: design-time-placeholder-key-not-a-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore tools
        run: dotnet tool restore

      - name: Generate idempotent SQL script
        run: >
          dotnet ef migrations script
          --project MerhumAPI
          --startup-project MerhumAPI
          --configuration Release
          --idempotent
          --output artifacts/migrations.sql

      - name: Build migration bundle
        run: >
          dotnet ef migrations bundle
          --project MerhumAPI
          --startup-project MerhumAPI
          --configuration Release
          --self-contained
          --target-runtime linux-x64
          --output artifacts/efbundle
          --force

      - uses: actions/upload-artifact@v7
        with:
          name: migrations
          path: artifacts/
          if-no-files-found: error

  deploy-staging:
    name: Deploy staging
    needs: [docker, migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.docker.outputs.image }}
    secrets: inherit

  deploy-production:
    name: Deploy production
    needs: [docker, deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.docker.outputs.image }}
    secrets: inherit

  notify:
    name: Notify failure
    needs: [changes, backend, flutter-result, docker, migrations, deploy-staging, deploy-production]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send Slack message
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg text "CI failed on $GITHUB_REPOSITORY ($GITHUB_REF_NAME, $GITHUB_EVENT_NAME): $RUN_URL" '{text: $text}' \
            | curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
